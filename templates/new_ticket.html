{% extends "base.html" %}
{% block title %}— New Ticket{% endblock %}
{% block content %}
<div style="max-width:640px">
  <div class="page-header">
    <div class="page-title">New Ticket</div>
    <a href="{{ url_for('dashboard') }}" class="btn btn-ghost btn-sm">← Back</a>
  </div>
  <div class="card">
    <form method="POST">
      <div class="form-group">
        <label>Title</label>
        <input type="text" name="title" required autofocus placeholder="Brief summary"/>
      </div>
      <div class="form-group">
        <label>Description</label>
        <textarea name="description" required placeholder="Describe the task in detail..."></textarea>
      </div>
      <div class="grid-2">
        <div class="form-group">
          <label>Category</label>
          <select name="category_id">
            <option value="">— No category —</option>
            {% for cat in categories %}
            <option value="{{ cat.id }}">{{ cat.name }}</option>
            {% endfor %}
          </select>
        </div>
        <div class="form-group">
          <label>Priority</label>
          <select name="priority">
            <option value="low">Low</option>
            <option value="medium" selected>Medium</option>
            <option value="high">High</option>
          </select>
        </div>
      </div>
      <div class="form-group">
        <label>Assign to</label>
        <select name="assigned_to">
          <option value="">— Unassigned —</option>
          {% for user in users %}
          <option value="{{ user.id }}">{{ user.name }}{% if user.team %} ({{ user.team.name }}){% endif %}</option>
          {% endfor %}
        </select>
      </div>
      <div class="grid-2">
        <div class="form-group">
          <label>Start Date</label>
          <input type="date" name="start_date"/>
        </div>
        <div class="form-group">
          <label>Due Date</label>
          <input type="date" name="due_date"/>
        </div>
      </div>
      <button type="submit" class="btn btn-primary">Submit ticket</button>
    </form>
  </div>
</div>
{% endblock %}
