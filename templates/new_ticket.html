{% extends "base.html" %}
{% block title %}— New Ticket{% endblock %}
{% block content %}
<div style="max-width:680px">
  <div class="page-header">
    <div class="page-title">New Ticket</div>
    <a href="{{ url_for('dashboard') }}" class="btn btn-ghost btn-sm">← Back</a>
  </div>
  <div class="card">
    <form method="POST">
      <div class="form-group">
        <label>Title</label>
        <input type="text" name="title" required autofocus placeholder="Brief summary of the task"/>
      </div>
      <div class="form-group">
        <label>Description</label>
        <textarea name="description" required placeholder="Describe the task in detail..."></textarea>
      </div>
      <div class="grid-2">
        <div class="form-group">
          <label>Category</label>
          <select name="category_id">
            <option value="">— No category —</option>
            {% for cat in categories %}
            <option value="{{ cat.id }}">{{ cat.name }}</option>
            {% endfor %}
          </select>
        </div>
        <div class="form-group">
          <label>Priority</label>
          <select name="priority">
            <option value="low">Low</option>
            <option value="medium" selected>Medium</option>
            <option value="high">High</option>
          </select>
        </div>
      </div>
      <div class="form-group">
        <label>Primary Assignee</label>
        <select name="assigned_to">
          <option value="">— Unassigned —</option>
          {% for user in users %}
          <option value="{{ user.id }}">{{ user.name }}{% if user.team %} ({{ user.team.name }}){% endif %}</option>
          {% endfor %}
        </select>
      </div>
      <div class="form-group">
        <label>Secondary SPOCs <span style="font-weight:300;text-transform:none;letter-spacing:0;font-size:0.75rem">(hold Ctrl/Cmd to select multiple)</span></label>
        <select name="spocs" multiple>
          {% for user in users %}
          <option value="{{ user.id }}">{{ user.name }}{% if user.team %} ({{ user.team.name }}){% endif %}</option>
          {% endfor %}
        </select>
      </div>
      <div class="grid-2">
        <div class="form-group">
          <label>Start Date</label>
          <input type="text" name="start_date" class="datepicker" placeholder="Pick a date" autocomplete="off"/>
        </div>
        <div class="form-group">
          <label>Due Date</label>
          <input type="text" name="due_date" class="datepicker" placeholder="Pick a date" autocomplete="off"/>
        </div>
      </div>
            <div class="form-group">
        <label>Reference URL <span style="font-weight:300;text-transform:none;letter-spacing:0;font-size:0.75rem">(Google Sheet, doc, or any link)</span></label>
        <input type="url" name="reference_url" placeholder="https://docs.google.com/spreadsheets/..."/>
      </div>
      <button type="submit" class="btn btn-primary" style="margin-top:0.5rem">Submit ticket</button>
    </form>
  </div>
</div>
{% endblock %}
