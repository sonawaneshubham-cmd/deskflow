{% extends "base.html" %}
{% block title %}— New Ticket{% endblock %}
{% block content %}
<div style="max-width:600px">
  <div class="page-header">
    <div class="page-title">Submit a ticket</div>
    <a href="{{ url_for('dashboard') }}" class="btn btn-ghost btn-sm">← Back</a>
  </div>
  <div class="card">
    <form method="POST">
      <div class="form-group">
        <label>Title</label>
        <input type="text" name="title" required autofocus placeholder="Brief summary of the issue"/>
      </div>
      <div class="form-group">
        <label>Description</label>
        <textarea name="description" required placeholder="Describe the issue in detail — steps to reproduce, expected vs actual behaviour..."></textarea>
      </div>
      <div class="form-group">
        <label>Priority</label>
        <select name="priority">
          <option value="low">Low</option>
          <option value="medium" selected>Medium</option>
          <option value="high">High</option>
        </select>
      </div>
      <button type="submit" class="btn btn-primary">Submit ticket</button>
    </form>
  </div>
</div>
{% endblock %}
