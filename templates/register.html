{% extends "base.html" %}
{% block title %}— Register{% endblock %}
{% block content %}
<div class="auth-card">
  <div class="auth-title">Create account</div>
  <div class="auth-sub">First user registered becomes admin</div>
  <div class="card">
    <form method="POST">
      <div class="form-group">
        <label>Full name</label>
        <input type="text" name="name" required autofocus placeholder="Ada Lovelace"/>
      </div>
      <div class="form-group">
        <label>Email</label>
        <input type="email" name="email" required placeholder="you@company.com"/>
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" name="password" required placeholder="Min 8 characters"/>
      </div>
      <button type="submit" class="btn btn-primary" style="width:100%;justify-content:center;margin-top:0.5rem">Create account</button>
    </form>
  </div>
  <p style="text-align:center;margin-top:1rem;font-size:0.85rem;color:var(--text-dim)">
    Already have an account? <a href="{{ url_for('login') }}">Sign in</a>
  </p>
</div>
{% endblock %}
